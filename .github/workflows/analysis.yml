name: Static analysis

on:
  push:
    branches: ["**"]
  pull_request:

env:
  GO_VERSION: "1.27.1"

jobs:
  quality:
    name: quality (staticcheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.2

      - name: Run staticcheck (any finding fails the build)
        shell: bash
        run: |
          mkdir -p report
          staticcheck ./... 2>&1 | tee report/staticcheck.txt

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: staticcheck-report
          path: report/

  security:
    name: security (gosec)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run gosec (findings of HIGH severity fail the build)
        run: |
          mkdir -p report
          gosec -severity high -fmt html -out report/gosec.html ./...

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gosec-report
          path: report/

  secrets:
    name: secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      - name: Run gitleaks (any found secret fails the build)
        run: |
          mkdir -p report
          gitleaks git --redact --report-format json --report-path report/gitleaks.json .

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: report/

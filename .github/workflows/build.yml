name: Build image

on:
  push:
    branches: ["**"]
  pull_request:

env:
  IMAGE: ristosha/pastebox

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker build
        run: docker build -t $IMAGE:build-${{ github.run_number }} .

      - name: Docker push (dev, prod only)
        if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'prod')
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u ristosha --password-stdin
          docker tag $IMAGE:build-${{ github.run_number }} $IMAGE:${{ github.ref_name }}
          docker push $IMAGE:${{ github.ref_name }}

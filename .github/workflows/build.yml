name: Build image

on:
  push:
    branches: ["**"]
  pull_request:

env:
  IMAGE: ristosha/pastebox

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker build
        run: docker build -t $IMAGE:build-${{ github.run_number }} .

      - name: Docker push (dev, prod only)
        if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'prod')
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u ristosha --password-stdin
          docker tag $IMAGE:build-${{ github.run_number }} $IMAGE:${{ github.ref_name }}
          docker push $IMAGE:${{ github.ref_name }}

  deploy-stage:
    needs: build
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: [self-hosted, test]
    env:
      STAGE: devops@192.168.56.11
      SSH_OPTS: -i /home/devops/.ssh/stage_deploy -o StrictHostKeyChecking=accept-new
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Copy compose file and migrations to stage
        run: |
          scp $SSH_OPTS deploy/docker-compose.yaml $STAGE:pastebox/docker-compose.yaml
          scp $SSH_OPTS -r migrations $STAGE:pastebox/

      - name: Deploy image to stage
        run: ssh $SSH_OPTS $STAGE 'cd pastebox && docker compose pull && docker compose up -d'

name: Build image

on:
  push:
    branches: ["**"]
  pull_request:

env:
  IMAGE: ristosha/pastebox

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker build
        run: docker build -t $IMAGE:build-${{ github.run_number }} .

  test:
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pastebox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pastebox_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/pastebox_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"

      - name: Run unit and integration tests
        run: go test ./... -count=1 -v -cover

  publish:
    needs: test
    if: github.event_name == 'push' && (github.ref_name == 'dev' || github.ref_name == 'prod')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docker build
        run: docker build -t $IMAGE:${{ github.ref_name }} .

      - name: Docker push
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u ristosha --password-stdin
          docker push $IMAGE:${{ github.ref_name }}

  deploy-stage:
    needs: publish
    if: github.event_name == 'push' && github.ref_name == 'dev'
    runs-on: [self-hosted, test]
    env:
      STAGE: devops@192.168.56.11
      SSH_OPTS: -i /home/devops/.ssh/stage_deploy -o StrictHostKeyChecking=accept-new
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Copy compose file and migrations to stage
        run: |
          scp $SSH_OPTS deploy/docker-compose.yaml $STAGE:pastebox/docker-compose.yaml
          scp $SSH_OPTS -r migrations $STAGE:pastebox/

      - name: Deploy image to stage
        run: ssh $SSH_OPTS $STAGE 'cd pastebox && docker compose pull && docker compose up -d'